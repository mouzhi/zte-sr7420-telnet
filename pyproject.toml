[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zte-sr7420-telnet"
version = "0.2.0"
description = "Owner-operated ZTE SR7420 LAN Telnet and key-only SSH management research tools"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = ["pycryptodomex>=3.20,<4"]

[project.scripts]
sr7420-telnet = "sr7420.cli:main"

[tool.setuptools]
packages = ["sr7420"]

[tool.setuptools.package-data]
sr7420 = ["assets/*.sh"]
