name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -v
      - run: python -m sr7420.cli --help
      - run: python -m sr7420.ssh_setup --help
      - run: python -m sr7420.ssh_bridge --help
      - if: runner.os == 'Linux'
        run: sh -n scripts/build-dropbear.sh && sh -n sr7420/assets/start-ssh.sh
  build-dropbear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends make gcc-arm-linux-gnueabi libc6-dev-armel-cross
      - name: Build pinned patched ARM server (no deployment)
        run: sh scripts/build-dropbear.sh "$RUNNER_TEMP/sr7420-dropbear-build"
